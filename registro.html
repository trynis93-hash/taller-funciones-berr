<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div
      style="
        background: var(--surface-2);
        border-radius: 12px;
        border: 0.5px solid var(--border);
        padding: 1.25rem 1.5rem;
      "
    >
      <h2 class="sr-only">
        Formulario de registro con cuatro campos: nombre, cargo, ciudad y edad.
      </h2>

      <p style="font-size: 18px; font-weight: 500; margin: 0 0 4px">
        Datos del participante
      </p>
      <p
        style="font-size: 13px; color: var(--text-secondary); margin: 0 0 20px"
      >
        Todos los campos son obligatorios.
      </p>

      <div
        style="
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
          gap: 16px;
        "
      >
        <div>
          <label
            for="f-nombre"
            style="
              display: block;
              font-size: 13px;
              color: var(--text-secondary);
              margin-bottom: 6px;
            "
            >Nombre</label
          >
          <input
            type="text"
            id="f-nombre"
            placeholder="María Gómez"
            style="width: 100%"
          />
          <p
            id="e-nombre"
            style="
              font-size: 13px;
              color: var(--text-danger);
              margin: 6px 0 0;
              display: none;
            "
          ></p>
        </div>

        <div>
          <label
            for="f-cargo"
            style="
              display: block;
              font-size: 13px;
              color: var(--text-secondary);
              margin-bottom: 6px;
            "
            >Cargo</label
          >
          <input
            type="text"
            id="f-cargo"
            placeholder="Analista de datos"
            style="width: 100%"
          />
          <p
            id="e-cargo"
            style="
              font-size: 13px;
              color: var(--text-danger);
              margin: 6px 0 0;
              display: none;
            "
          ></p>
        </div>

        <div>
          <label
            for="f-ciudad"
            style="
              display: block;
              font-size: 13px;
              color: var(--text-secondary);
              margin-bottom: 6px;
            "
            >Ciudad</label
          >
          <input
            type="text"
            id="f-ciudad"
            placeholder="Bogotá"
            style="width: 100%"
          />
          <p
            id="e-ciudad"
            style="
              font-size: 13px;
              color: var(--text-danger);
              margin: 6px 0 0;
              display: none;
            "
          ></p>
        </div>

        <div>
          <label
            for="f-edad"
            style="
              display: block;
              font-size: 13px;
              color: var(--text-secondary);
              margin-bottom: 6px;
            "
            >Edad</label
          >
          <input
            type="number"
            id="f-edad"
            min="16"
            max="99"
            step="1"
            placeholder="34"
            style="width: 100%"
          />
          <p
            id="e-edad"
            style="
              font-size: 13px;
              color: var(--text-danger);
              margin: 6px 0 0;
              display: none;
            "
          ></p>
        </div>
      </div>

      <div
        style="display: flex; gap: 12px; align-items: center; margin-top: 20px"
      >
        <button id="f-enviar">Enviar</button>
        <button id="f-limpiar">Limpiar</button>
      </div>

      <div
        id="f-resumen"
        style="
          display: none;
          margin-top: 20px;
          border-top: 0.5px solid var(--border);
          padding-top: 16px;
        "
      >
        <p
          style="font-size: 13px; color: var(--text-success); margin: 0 0 12px"
        >
          <i
            class="ti ti-check"
            style="font-size: 16px; vertical-align: -2px; margin-right: 6px"
            aria-hidden="true"
          ></i
          >Registro recibido
        </p>
        <table style="width: 100%; font-size: 14px; table-layout: fixed">
          <tr>
            <td style="color: var(--text-secondary); padding: 4px 0">Nombre</td>
            <td id="r-nombre" style="text-align: right; padding: 4px 0"></td>
          </tr>
          <tr>
            <td style="color: var(--text-secondary); padding: 4px 0">Cargo</td>
            <td id="r-cargo" style="text-align: right; padding: 4px 0"></td>
          </tr>
          <tr>
            <td style="color: var(--text-secondary); padding: 4px 0">Ciudad</td>
            <td id="r-ciudad" style="text-align: right; padding: 4px 0"></td>
          </tr>
          <tr>
            <td style="color: var(--text-secondary); padding: 4px 0">Edad</td>
            <td id="r-edad" style="text-align: right; padding: 4px 0"></td>
          </tr>
        </table>
      </div>
    </div>
    <script src="registro.js"></script>
  </body>
</html>
